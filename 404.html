<script>
// 404.html e afișat pentru ORICE adresă greșită (ex. /repo/a/b/c), deci setăm rădăcina site-ului ca să se încarce css/ și js/
(function(){
 var REPO_ROOT=null;                       // dacă site-ul e la rădăcina domeniului (username.github.io), pune "/"
 var p=location.pathname.split("/").filter(Boolean),r="/";
 if(REPO_ROOT)r=REPO_ROOT;
 else if(/\.github\.io$/.test(location.hostname)&&p.length)r="/"+p[0]+"/";    // site de proiect: username.github.io/NUME-REPO/
 if(/\/404\.html$/.test(location.pathname))r=location.pathname.replace(/404\.html$/,"");   // deschis direct, pentru test
 var b=document.createElement("base");b.href=r;document.head.appendChild(b);
})();
</script>
