<body>
<header class="top"><div class="wrap"><h1>Recomandă un loc</h1><p class="sub">Știi un loc care ar trebui să apară în ghid? Spune-mi. Câmpurile cu * sunt obligatorii.</p></div></header>
<main class="wrap">
 <div id="ok" class="ok" role="status" hidden>Mulțumesc! Recomandarea ta a fost validată.</div>
 <div id="sendErr" class="eroare" role="alert" hidden></div>
 <form id="cf" class="form" novalidate>
  <label>Nume *<input id="nume" aria-describedby="e_nume" aria-required="true" autocomplete="name"><span class="err" aria-live="polite" id="e_nume"></span></label>
  <label>Email *<input id="email" aria-describedby="e_email" aria-required="true" type="email" autocomplete="email"><span class="err" aria-live="polite" id="e_email"></span></label>
  <label>Telefon *<input id="tel" aria-describedby="e_tel" aria-required="true" type="tel" autocomplete="tel" placeholder="07xx xxx xxx"><span class="err" aria-live="polite" id="e_tel"></span></label>
  <label>Locul recomandat *<input id="locul" aria-describedby="e_locul" aria-required="true"><span class="err" aria-live="polite" id="e_locul"></span></label>
  <label>De ce ar trebui să-l încerc? *<textarea id="msg" aria-describedby="e_msg" aria-required="true" rows="4"></textarea><span class="err" aria-live="polite" id="e_msg"></span></label>
  <label class="check"><input type="checkbox" id="acord" aria-describedby="e_acord">&nbsp;Sunt de acord cu prelucrarea datelor *</label><span class="err" aria-live="polite" id="e_acord"></span>
  <input type="text" id="_honey" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <button type="submit">Trimite recomandarea</button> <span id="stare" role="status"></span>
 </form>
</main>
<script src="js/common.js"></script>
<script src="js/program.js"></script>
<script src="js/layout.js"></script>
<script src="js/i18n.js"></script>
<script src="js/recomanda.js"></script>
</body>
</html>
