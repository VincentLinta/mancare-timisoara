<body>
<header class="top"><div class="wrap"><h1>Hartă</h1><p class="sub">Toate locurile cu coordonate, pe OpenStreetMap. Apasă pe un marker pentru detalii.</p></div></header>
<main class="wrap">
 <label class="lbl">Caută pe hartă <select id="hp" style="padding:.7rem;border-radius:.6rem;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem"></select></label>
 <p id="hmsg" class="sub" role="status"></p>
 <div id="lm" class="mapa" hidden></div>
 <iframe id="hm" class="mapa" title="Hartă Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
 <p><a id="hl" class="btn" href="#" target="_blank" rel="noopener">Deschide în Google Maps ↗</a></p>
</main>
