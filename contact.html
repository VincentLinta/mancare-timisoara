<body data-form="contact">
<header class="top"><div class="wrap"><h1>Contact</h1><p class="sub">Ai o întrebare, o sugestie sau ai găsit o greșeală? Scrie-mi. Câmpurile cu * sunt obligatorii.</p></div></header>
<main class="wrap">
 <div id="ok" class="ok" role="status" hidden>Mulțumesc! Mesajul tău a fost validat.</div>
 <div id="sendErr" class="eroare" role="alert" hidden></div>
 <form id="cf" class="form" novalidate>
  <label>Nume *<input id="nume" aria-describedby="e_nume" aria-required="true" autocomplete="name"><span class="err" aria-live="polite" id="e_nume"></span></label>
  <label>Email *<input id="email" aria-describedby="e_email" aria-required="true" type="email" autocomplete="email"><span class="err" aria-live="polite" id="e_email"></span></label>
  <label>Telefon (opțional)<input id="tel" data-optional aria-describedby="e_tel" type="tel" autocomplete="tel" placeholder="07xx xxx xxx"><span class="err" aria-live="polite" id="e_tel"></span></label>
  <label>Subiect *<select id="subiect" aria-describedby="e_subiect" aria-required="true"><option value="">Alege un subiect…</option><option value="Întrebare despre un loc">Întrebare despre un loc</option><option value="Greșeală în date">Greșeală în date</option><option value="Sugestie pentru site">Sugestie pentru site</option><option value="Altceva">Altceva</option></select><span class="err" aria-live="polite" id="e_subiect"></span></label>
  <label>Mesaj *<textarea id="msg" aria-describedby="e_msg" aria-required="true" rows="5"></textarea><span class="err" aria-live="polite" id="e_msg"></span></label>
  <label class="check"><input type="checkbox" id="acord" aria-describedby="e_acord">&nbsp;Sunt de acord cu prelucrarea datelor *</label><span class="err" aria-live="polite" id="e_acord"></span>
  <input type="text" id="_honey" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <button type="submit">Trimite mesajul</button> <span id="stare" role="status"></span>
 </form>
 <p class="sub">Vrei să propui un loc nou în ghid? Folosește pagina <a href="recomanda.html">Recomandă</a>.</p>
</main>
<script src="js/common.js"></script>
